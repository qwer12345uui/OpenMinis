name: Build iOS 15 IPA

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240

    steps:
      - name: Checkout (with native-dep submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version || true
          clang --version | head -1

      - name: Restore executable bits on build scripts
        run: |
          set -euo pipefail
          chmod +x deps/*.sh scripts/*.sh scripts/*.py 2>/dev/null || true
          find deps -maxdepth 3 \( -name configure -o -name install-sh -o -name config.guess -o -name config.sub -o -name compile -o -name depcomp -o -name missing \) -exec chmod +x {} + 2>/dev/null || true

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          brew install ninja llvm lld libarchive pkg-config go
          python3 -m pip install meson --break-system-packages 2>/dev/null || python3 -m pip install meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Metal Toolchain (best effort)
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal toolchain unavailable — FFmpeg will drop the Metal deinterlace filter (non-fatal)"

      - name: Cache native dependency artifacts
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
            deps/rclone-build
          key: minis-native-deps-${{ runner.os }}-${{ hashFiles('deps/*.sh') }}

      - name: Build native dependencies (LAME → FFmpeg → iSH → rootfs → rclone)
        run: |
          set -euo pipefail
          ls /opt/homebrew/opt/llvm/bin | grep -iE '^(ld|lld|wasm)' || true
          command -v ld.lld || true
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Build Minis.app (unsigned, iOS 15.0 deployment target)
        run: |
          set -euo pipefail
          test -f src/ios/Configs/ProviderCustomization.xcconfig || cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $APP"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry OpenMinis-iOS15-unsigned.ipa Payload
          ls -lh OpenMinis-iOS15-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-iOS15-unsigned-ipa
          path: OpenMinis-iOS15-unsigned.ipa
          if-no-files-found: error
