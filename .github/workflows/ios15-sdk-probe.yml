name: iOS15 SDK probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Write probes
        run: |
          set -euo pipefail
          mkdir -p probe

          cat > probe/p1_viewbuilder.swift <<'EOF'
          import SwiftUI
          struct P1: View {
              var flag: Bool
              var body: some View {
                  VStack {
                      if flag { Text("a") }
                      if flag { Text("b") } else { Text("c") }
                  }
              }
          }
          EOF

          cat > probe/p2_toolbar.swift <<'EOF'
          import SwiftUI
          struct P2: View {
              var flag: Bool
              var body: some View {
                  Text("x")
                      .toolbar {
                          if flag {
                              ToolbarItem(placement: .navigationBarLeading) { Text("a") }
                          }
                      }
              }
          }
          EOF

          cat > probe/p3_viewmodifiers.swift <<'EOF'
          import SwiftUI
          struct P3: View {
              var body: some View {
                  Group {
                      Text("a").bold()
                      Text("b").fontWeight(.semibold)
                      Text("c").lineLimit(1...3)
                      Color.clear.draggable("x")
                  }
              }
          }
          EOF

          cat > probe/p4_locale.swift <<'EOF'
          import Foundation
          func p4a() -> String? {
              Locale.current.language.languageCode?.identifier
          }
          func p4b(_ l: Locale) -> String? {
              l.language.languageCode?.identifier
          }
          EOF

          cat > probe/p5_tasksleep.swift <<'EOF'
          import Foundation
          func p5() async throws {
              try await Task.sleep(for: .milliseconds(10))
          }
          EOF

          cat > probe/p6_contextmenu.swift <<'EOF'
          import SwiftUI
          struct P6: View {
              var body: some View {
                  Text("x").contextMenu {
                      Button("a") {}
                  }
              }
          }
          EOF

          ls -la probe

      - name: Run probe at iOS 15.0
        if: always()
        run: |
          set -uo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for f in probe/*.swift; do
            echo "############ $f (ios15.0)"
            xcrun -sdk iphoneos swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios15.0 "$f" 2>&1 | head -40 || true
          done

      - name: Run probe at iOS 16.0 (control)
        if: always()
        run: |
          set -uo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for f in probe/*.swift; do
            echo "############ $f (ios16.0)"
            xcrun -sdk iphoneos swiftc -typecheck -sdk "$SDK" -target arm64-apple-ios16.0 "$f" 2>&1 | head -20 || true
          done
